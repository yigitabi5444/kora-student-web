<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kora Aerospace Student Team</title>
  <meta name="description" content="ODTÜ student team that designs, builds and flies drones. Looking for new members.">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="wrap nav">
    <a href="./"><img src="media/logo.svg" alt="Kora Aerospace Student Team" class="logo" width="80" height="37"></a>
    <a href="apply/" class="tab">Apply</a>
  </header>

  <main class="wrap">
    <section class="hero">
      <div>
        <p class="tag">// Kora Aerospace Student Team</p>
        <h1>Looking for new members</h1>
        <p class="lead">ODTÜ students who design, build and fly drones.</p>
        <a href="apply/" class="btn">Apply</a>
      </div>
      <img src="media/launch.jpg" alt="Hand launch of a flying wing" width="1200" height="778">
    </section>

    <section>
      <div class="cards">
        <figure>
          <img src="media/cad.jpg" alt="CAD model of a flying wing" width="900" height="582" loading="lazy">
          <figcaption><b>Design</b>From the airfoil to the CAD model.</figcaption>
        </figure>
        <figure>
          <img src="media/wing.jpg" alt="Flying wing built by the team" width="900" height="667" loading="lazy">
          <figcaption><b>Airframe</b>Built and flown by the team.</figcaption>
        </figure>
        <figure>
          <img src="media/pcb.jpg" alt="Flight controller board" width="680" height="900" loading="lazy">
          <figcaption><b>Avionics</b>Our own flight controller board.</figcaption>
        </figure>
      </div>
      <p class="note">We learn in short build sprints and compete in SUAS and TEKNOFEST.</p>
    </section>
  </main>

  <footer class="wrap">
    <a href="mailto:kora.aerospace@gmail.com">kora.aerospace@gmail.com</a>
    <a href="https://kora-aerospace.com">Kora Aerospace</a>
  </footer>
</body>
</html>
